[package]
name = "ariane"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Axel de Saint-Germain"]
[lib]
name = "ariane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
performance-harness = []
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
regex = "1"
aho-corasick = "1"
unicode-normalization = "0.1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
libc = "0.2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
[profile.dev]
debug = 0
incremental = false
[profile.release]
strip = true
lto = "thin"
