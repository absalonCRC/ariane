name: Dependency security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'
permissions:
  contents: read
jobs:
  application:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=low
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit macOS application dependencies
        run: |
          cargo audit --file src-tauri/Cargo.lock --target-os macos --target-arch aarch64 --json > rust-audit.json || audit_status=$?
          python3 scripts/check-rust-audit.py rust-audit.json
  python:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [memory, voice]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned Python runtime
        run: |
          pip-audit --disable-pip --no-deps -r scripts/${{ matrix.runtime }}-requirements.lock -f json -o python-audit.json || audit_status=$?
          python scripts/check-python-audit.py python-audit.json
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python scripts/audit-native.py
      - run: python -m unittest discover -s scripts/tests -v
