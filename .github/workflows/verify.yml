name: Verify alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Let each commit finish verification even when another push arrives.
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - run: npm ci
      - run: python3 scripts/check-publication.py
      - name: Prepare pinned native resources
        run: python3 scripts/setup-resources.py
      - name: Diagnose local model startup
        run: |
          src-tauri/resources/engine/llama-server -m src-tauri/resources/models/embeddinggemma-300M-Q8_0.gguf --api-key test --embedding --pooling mean --host 127.0.0.1 --port 18543 -c 2048 -b 2048 -ub 2048 -np 1 -ngl 99 > "$RUNNER_TEMP/ariane-engine.log" 2>&1 &
          engine_pid=$!
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:18543/health >/dev/null; then kill "$engine_pid"; wait "$engine_pid" || true; cat "$RUNNER_TEMP/ariane-engine.log"; exit 0; fi
            if ! kill -0 "$engine_pid" 2>/dev/null; then wait "$engine_pid" || true; cat "$RUNNER_TEMP/ariane-engine.log"; exit 1; fi
            sleep 1
          done
          kill "$engine_pid" || true
          wait "$engine_pid" || true
          cat "$RUNNER_TEMP/ariane-engine.log"
          exit 1
      - run: npm run verify
        env:
          # Native integration tests each launch the real embedding model.
          # Share the runner's limited CPU/GPU by running Rust tests serially.
          RUST_TEST_THREADS: '1'
      - name: Build local app (ad hoc, no publication)
        run: npm run tauri build -- --bundles app
      - name: Check bundled resources
        run: python3 scripts/verify-resources.py src-tauri/target/release/bundle/macos/Ariane.app/Contents/Resources/resources
